    <path d="M53 67 L59 70 L59 78 L53 75 Z" fill="#FFFFFF" opacity="0.8" />
    <path d="M45 74 L51 77 L51 84 L45 81 Z" fill="#FFFFFF" opacity="0.8" />
    <path d="M53 78 L59 81 L59 88 L53 85 Z" fill="#FFFFFF" opacity="0.8" />
