    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284C7" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- 云朵几何轮廓 -->
  <path d="M96 52c0-15.464-12.536-28-28-28-12.04 0-22.37 7.61-26.31 18.28C38.98 42.11 36.56 42 34 42 20.745 42 10 52.745 10 66c0 12.378 9.356 22.568 21.365 23.82L96 90c12.15 0 22-9.85 22-22 0-10.457-7.3-19.208-17.18-21.46C100.27 48.65 96 52 96 52z" fill="url(#cloudGrad)" opacity="0.18" />
  
  <path d="M92 56c0-13.255-10.745-24-24-24-10.28 0-19.11 6.47-22.5 15.6C43.08 47.53 41.08 47.43 39 47.43 27.95 47.43 19 56.38 19 67.43c0 10.36 7.87 18.89 18 19.92h54c10.49 0 19-8.51 19-19 0-9.25-6.61-16.96-15.42-18.73A23.8 23.8 0 0092 56z" stroke="url(#cloudGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- 3D 极简存储立方体 (居中) -->
